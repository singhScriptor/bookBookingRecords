<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <title>book_Records</title>
</head>

<body>
  <div class="main-div">
    <form class="form" id="form">
      <div class="detail-div col-12 col-md-6 p-5 ms-auto ">
        <label for="name">BookName:</label>
        <input type="text" name="name" id="book" class="book" required>
        <button type="submit" id="submit" class="sunmit">Submit</button>
      </div>

    </form>
  </div>
  <aside class="list-div d-flex flex-lg-row flex-column">
    <div class="active-lists w-50 overflow-y-axis" style="max-height: 300px;">
      <h2 class="sec-header">Active-Books:</h2>
      <ul class="active-books" id="active-books"></ul>
    </div><hr>
    <div class="returned-list w-50 overflow-y-axis " style="max-height: 300px;">
      <h2 class="sec-header">Returned-Books:</h2>
      <ul class="return-books" id="return-books"></ul>
    </div>
  </aside>

</body>

</html>
